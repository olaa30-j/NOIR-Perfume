<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop all NOIR Arabian Luxury fragrances — oud, amber, musk and floral.">
  <title>Shop — NOIR Arabian Luxury</title>

  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('noir-theme-prefs') || '{}');
        var r = document.documentElement;
        if (p.bg) r.style.setProperty('--bg', p.bg);
        if (p.text) r.style.setProperty('--text', p.text);
        if (p.accent) r.style.setProperty('--accent', p.accent);
        if (p.serif) r.style.setProperty('--font-serif', '"' + p.serif + '"');
        if (p.sans) r.style.setProperty('--font-sans', '"' + p.sans + '"');
        if (p.preset) r.setAttribute('data-theme', p.preset);
        var d = JSON.parse(localStorage.getItem('noir-app-settings') || '{}');
        if (d.radius != null) r.style.setProperty('--radius', d.radius + 'px');
        if (d.language) { r.lang = d.language; r.dir = d.language === 'ar' ? 'rtl' : 'ltr'; }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/branding.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script  type="module" src="js/app.js"></script>
  <script src="js/products.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script type="module" src="js/components/index.js"></script>
</head>
<body>
  <noir-layout>
    <main>
      <section class="shop-section section-wrap" id="shop">
        <div class="section-heading">
          <div>
            <p class="eyebrow centered">✦ &nbsp; Our selection &nbsp; ✦</p>
            <h2 data-i18n="section.featured">Featured <em>fragrances</em></h2>
            <p class="section-subtitle">Find the scent that feels like you.</p>
          </div>
        </div>
        <div class="shop-toolbar">
          <label class="search-field">
            <span aria-hidden="true">⌕</span>
            <input id="product-search" type="search" placeholder="Search fragrances..." aria-label="Search fragrances">
          </label>
          <label class="select-field">
            <span class="sr-only">Filter by collection</span>
            <select id="category-filter">
              <option value="all">All collections</option>
              <option value="Oud">Oud</option>
              <option value="Amber">Amber</option>
              <option value="Musk">Musk</option>
              <option value="Floral">Floral</option>
            </select>
          </label>
          <label class="select-field">
            <span class="sr-only">Sort products</span>
            <select id="sort-filter">
              <option value="featured">Featured</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
            </select>
          </label>
        </div>
        <div class="product-grid" id="product-grid" aria-live="polite"></div>
        <p class="empty-state hidden" id="empty-state">No fragrances found. Try another search.</p>
      </section>
    </main>
  </noir-layout>
</body>
</html>
