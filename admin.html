<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NOIR admin studio — demo dashboard.">
  <title>Admin — NOIR Arabian Luxury</title>

  <!-- Anti-flash theme + language + radius -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('noir-theme-prefs');
        if (raw) {
          var p = JSON.parse(raw);
          var r = document.documentElement;
          if (p.bg) r.style.setProperty('--bg', p.bg);
          if (p.text) r.style.setProperty('--text', p.text);
          if (p.accent) r.style.setProperty('--accent', p.accent);
          if (p.serif) r.style.setProperty('--font-serif', '"' + p.serif + '"');
          if (p.sans) r.style.setProperty('--font-sans', '"' + p.sans + '"');
          if (p.preset) r.setAttribute('data-theme', p.preset);
        }
        var s = localStorage.getItem('noir-app-settings');
        if (s) {
          var d = JSON.parse(s);
          if (d.radius != null) r.style.setProperty('--radius', d.radius + 'px');
          if (d.language) { r.lang = d.language; r.dir = d.language === 'ar' ? 'rtl' : 'ltr'; }
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Config (secrets) — before supabase-client -->
  <script src="js/config.js"></script>

  <!-- Client init -->
  <script src="js/supabase-client.js" defer></script>

  <!-- Data layer -->
  <script src="js/store.js" defer></script>

  <!-- i18n + theme + auth -->
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/auth.js" defer></script>

  <!-- UI + admin -->
  <script src="js/app.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
  <section class="admin-app" id="admin-app" aria-label="Admin dashboard">
    <aside class="admin-sidebar">
      <a class="brand" href="index.html"><span>NOIR</span><small>ADMIN STUDIO</small></a>

      <p class="sidebar-label">WORKSPACE</p>
      <button class="admin-nav active" data-panel="overview">▦ &nbsp; Overview</button>
      <button class="admin-nav" data-panel="products">◇ &nbsp; Products</button>
      <button class="admin-nav" data-panel="orders">▤ &nbsp; Orders</button>
      <button class="admin-nav" data-panel="customers">♙ &nbsp; Customers</button>
      <button class="admin-nav" data-panel="bundles">◈ &nbsp; Bundles</button>
      <button class="admin-nav" data-panel="offers">% &nbsp; Offers</button>
      <button class="admin-nav" data-panel="settings">⚙ &nbsp; Settings</button>

      <div class="sidebar-bottom">
        <span class="status-dot" id="db-status-dot" style="background:#c89b55"></span>
        <span id="db-status-label">Connecting…</span>
        <button id="back-to-store" class="admin-nav">← &nbsp; Sign out &amp; return</button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div>
          <p class="eyebrow">NOIR / MANAGEMENT</p>
          <h1 id="admin-title">Overview</h1>
        </div>
        <div class="admin-profile">
          <span class="avatar">N</span>
          <span id="admin-name">Loading session…<br><small>—</small></span>
        </div>
      </header>

      <div class="admin-content" id="admin-content"></div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* ============================================================
       ADMIN SESSION CHECK
       1. Read localStorage session
       2. If missing, try Supabase Auth (getSession)
       3. Redirect to login if neither has admin
       4. Update UI with name + email + role
       ============================================================ */
    (function () {
      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function updateName(name, email, role) {
        const el = document.getElementById('admin-name');
        if (el) {
          el.innerHTML = esc(name || 'Admin') +
            '<br><small>' + esc(email || '—') + ' · ' + esc(role || 'admin') + '</small>';
        }
      }

      function redirectToLogin() {
        console.warn('[admin] No admin session — redirecting to login');
        location.replace('login.html?role=admin&next=admin.html');
      }

      async function checkSession() {
        // 1. Try localStorage
        let session = (typeof noirGetSession === 'function') ? noirGetSession() : null;
        console.info('[admin] localStorage session:', session);

        // 2. If no session, check Supabase
        if (!session && window.db && window.db.auth) {
          try {
            const { data } = await window.db.auth.getSession();
            if (data && data.session) {
              const user = data.session.user;
              const email = user.email || '';
              const role = email === 'admin@gmail.com' ? 'admin' : 'customer';
              session = {
                email,
                role,
                name: user.user_metadata?.name || email.split('@')[0],
                at: Date.now(),
                source: 'supabase',
                userId: user.id,
              };
              if (typeof noirSetSession === 'function') noirSetSession(session);
              console.info('[admin] Recovered session from Supabase:', session);
            }
          } catch (e) {
            console.error('[admin] Supabase getSession failed:', e);
          }
        }

        // 3. No session at all
        if (!session) {
          redirectToLogin();
          return;
        }

        // 4. Session exists but not admin
        if (session.role !== 'admin') {
          console.warn('[admin] Session is not admin:', session.role);
          redirectToLogin();
          return;
        }

        // 5. Success → update UI + render
        updateName(session.name, session.email, session.role);
        console.info('[admin] Admin session OK:', session.email);

        if (typeof renderAdmin === 'function') {
          try { renderAdmin('overview'); }
          catch (e) { console.error('[admin] renderAdmin failed:', e); }
        }
      }

      // Run after all defer scripts (auth.js, store.js, admin.js)
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(checkSession, 50);
        });
      } else {
        setTimeout(checkSession, 50);
      }

      // Listen for data-ready to render again
      window.addEventListener('noir:data-ready', function (e) {
        const dot = document.getElementById('db-status-dot');
        const label = document.getElementById('db-status-label');
        if (dot && label) {
          const source = e.detail && e.detail.source;
          if (source === 'supabase') {
            dot.style.background = '#4fae7a';
            label.textContent = 'Connected to Supabase';
          } else {
            dot.style.background = '#c89b55';
            label.textContent = 'Local mode (offline)';
          }
        }
        // Re-render so data is fresh
        if (typeof renderAdmin === 'function') {
          try { renderAdmin(); } catch (e) {}
        }
      });

      // Back to store
      document.addEventListener('click', function (e) {
        if (e.target.id === 'back-to-store' || e.target.closest('#back-to-store')) {
          e.preventDefault();
          if (typeof noirLogout === 'function') noirLogout('index.html');
          else { localStorage.removeItem('NOIR_SESSION'); location.href = 'index.html'; }
        }
      });
    })();
  </script>
</body>
</html>
