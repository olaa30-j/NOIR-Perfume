<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NOIR admin studio — management dashboard.">
  <title>Admin — NOIR Arabian Luxury</title>

  <!-- Anti-flash: fast first paint from localStorage hints.
       Real values are re-applied from Supabase by store.js + theme.js. -->
  <script>
    (function () {
      try {
        var r = document.documentElement;

        var raw = localStorage.getItem('noir-theme-prefs');
        if (raw) {
          var p = JSON.parse(raw);
          if (p.bg) r.style.setProperty('--bg', p.bg);
          if (p.text) r.style.setProperty('--text', p.text);
          if (p.accent) r.style.setProperty('--accent', p.accent);
          if (p.serif) r.style.setProperty('--font-serif', '"' + p.serif + '"');
          if (p.sans) r.style.setProperty('--font-sans', '"' + p.sans + '"');
          if (p.preset) r.setAttribute('data-theme', p.preset);
        }

        // Optional cached copy (store.js may keep this in sync for fast paint)
        var s = localStorage.getItem('noir-app-settings');
        if (s) {
          var d = JSON.parse(s);
          if (d.radius != null) r.style.setProperty('--radius', d.radius + 'px');
          if (d.language) { r.lang = d.language; r.dir = d.language === 'ar' ? 'rtl' : 'ltr'; }
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Config (secrets) — must load before supabase-client -->
  <script src="js/config.js"></script>

  <!-- Supabase client init -->
  <script src="js/supabase-client.js" defer></script>

  <!-- Data layer -->
  <script src="js/store.js" defer></script>
  <script src="js/branding.js" defer></script>

  <!-- i18n + theme + auth -->
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/auth.js" defer></script>

  <!-- UI + admin (admin.js contains bootAdmin — session check + redirect) -->
  <script src="js/app.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
  <section class="admin-app" id="admin-app" aria-label="Admin dashboard">
    <aside class="admin-sidebar">
      <a class="brand" href="index.html"><span>NOIR</span><small>ADMIN STUDIO</small></a>

      <p class="sidebar-label">WORKSPACE</p>
      <button class="admin-nav active" data-panel="overview">▦ &nbsp; Overview</button>
      <button class="admin-nav" data-panel="products">◇ &nbsp; Products</button>
      <button class="admin-nav" data-panel="orders">▤ &nbsp; Orders</button>
      <button class="admin-nav" data-panel="customers">♙ &nbsp; Customers</button>
      <button class="admin-nav" data-panel="bundles">◈ &nbsp; Bundles</button>
      <button class="admin-nav" data-panel="offers">% &nbsp; Offers</button>
      <button class="admin-nav" data-panel="settings">⚙ &nbsp; Settings</button>

      <div class="sidebar-bottom">
        <span class="status-dot" id="db-status-dot" style="background:#c89b55"></span>
        <span id="db-status-label">Connecting…</span>
        <button id="back-to-store" class="admin-nav">← &nbsp; Sign out &amp; return</button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div>
          <p class="eyebrow">NOIR / MANAGEMENT</p>
          <h1 id="admin-title">Overview</h1>
        </div>
        <div class="admin-profile">
          <span class="avatar">N</span>
          <span id="admin-name">Loading session…<br><small>—</small></span>
        </div>
      </header>

      <div class="admin-content" id="admin-content"></div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
