<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NOIR admin studio — demo dashboard.">
  <title>Admin — NOIR Arabian Luxury</title>

  <script>
    (function () {
      try {
        var raw = localStorage.getItem('noir-theme-prefs');
        if (raw) {
          var p = JSON.parse(raw);
          var r = document.documentElement;
          if (p.bg) r.style.setProperty('--bg', p.bg);
          if (p.text) r.style.setProperty('--text', p.text);
          if (p.accent) r.style.setProperty('--accent', p.accent);
          if (p.serif) r.style.setProperty('--font-serif', '"' + p.serif + '"');
          if (p.sans) r.style.setProperty('--font-sans', '"' + p.sans + '"');
          if (p.preset) r.setAttribute('data-theme', p.preset);
        }
        var raw2 = localStorage.getItem('noir-store-data');
        if (raw2) {
          var d = JSON.parse(raw2);
          if (d.settings && d.settings.radius != null) r.style.setProperty('--radius', d.settings.radius + 'px');
          if (d.settings && d.settings.language) { r.lang = d.settings.language; r.dir = d.settings.language === 'ar' ? 'rtl' : 'ltr'; }
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
  <section class="admin-app" id="admin-app" aria-label="Admin dashboard">
    <aside class="admin-sidebar">
      <a class="brand" href="index.html"><span>NOIR</span><small>ADMIN STUDIO</small></a>

      <p class="sidebar-label">WORKSPACE</p>
      <button class="admin-nav active" data-panel="overview">▦ &nbsp; Overview</button>
      <button class="admin-nav" data-panel="products">◇ &nbsp; Products</button>
      <button class="admin-nav" data-panel="orders">▤ &nbsp; Orders</button>
      <button class="admin-nav" data-panel="customers">♙ &nbsp; Customers</button>
      <button class="admin-nav" data-panel="bundles">◈ &nbsp; Bundles</button>
      <button class="admin-nav" data-panel="offers">% &nbsp; Offers</button>
      <button class="admin-nav" data-panel="settings">⚙ &nbsp; Settings</button>

      <div class="sidebar-bottom">
        <span class="status-dot" id="db-status-dot" style="background:#c89b55"></span>
        <span id="db-status-label">Connecting…</span>
        <button id="back-to-store" class="admin-nav">← &nbsp; Sign out &amp; return</button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div>
          <p class="eyebrow">NOIR / MANAGEMENT</p>
          <h1 id="admin-title">Overview</h1>
        </div>
        <div class="admin-profile">
          <span class="avatar">N</span>
          <span id="admin-name">Store admin<br><small>Demo account</small></span>
        </div>
      </header>

      <div class="admin-content" id="admin-content"></div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const s = typeof noirGetSession === 'function' ? noirGetSession() : null;
      if (!s || s.role !== 'admin') {
        location.replace('login.html?role=admin&next=admin.html');
        return;
      }
      const nameEl = document.getElementById('admin-name');
      if (nameEl && typeof escapeHTML === 'function') {
        nameEl.innerHTML = `${escapeHTML(s.name)}<br><small>${escapeHTML(s.email)}</small>`;
      } else if (nameEl) {
        nameEl.textContent = s.name;
      }

      if (typeof renderAdmin === 'function') renderAdmin('overview');
    });

    // Update status when data arrives
    window.addEventListener('noir:data-ready', (e) => {
      const dot = document.getElementById('db-status-dot');
      const label = document.getElementById('db-status-label');
      if (!dot || !label) return;
      const source = e.detail && e.detail.source;
      if (source === 'supabase') {
        dot.style.background = '#4fae7a';
        label.textContent = 'Connected to Supabase';
      } else {
        dot.style.background = '#c89b55';
        label.textContent = 'Local mode (offline)';
      }
    });

    console.info('[admin] Page loaded. Check noir:data-ready event above.');
  </script>
</body>
</html>
