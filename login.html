<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create an account — NOIR Arabian Luxury.">
  <title>Sign in — NOIR Arabian Luxury</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <link rel="stylesheet" href="css/pages/commerce.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/branding.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/i18n-extra.js" defer></script>
  <script src="js/order-tracker.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/bag.js" defer></script>
  <script src="js/ui-enhance.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script type="module" src="js/app.js"></script>
  <script src="js/cart.js" defer></script>
  <script src="js/checkout.js" defer></script>
  <script type="module" src="js/components/index.js"></script>

  <style>
    .auth-tabs { display: flex; max-width: 420px; margin: 22px auto 0;
      border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .auth-tab { flex: 1; padding: 12px 16px; background: transparent; border: none;
      cursor: pointer; font-family: var(--font-sans); font-size: 12px;
      letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .auth-tab.active { background: var(--gold-light, #c89b55); color: #1a1a1a; font-weight: 600; }
    .auth-panel.hidden { display: none; }
  </style>
</head>
<body>
  <!-- ============================================================
       FAST REDIRECT — if the visitor is already signed in, skip
       the login UI entirely. Runs before the loader paints.
       Kept inline so it doesn't depend on any deferred script.
       ============================================================ -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var next = params.get('next');
      var target = next
        ? decodeURIComponent(next)
        : 'index.html';

      function go(role) {
        if (next) { location.replace(decodeURIComponent(next)); return; }
        location.replace(role === 'admin' ? 'admin.html' : 'index.html');
      }

      // Fast path: existing session in noirGetSession() (once supabase-client/auth has loaded).
      window.addEventListener('noir:session-ready', function (e) {
        var s = e && e.detail;
        if (s && (s.userId || s.email)) go(s.role);
      });
      window.addEventListener('noir:auth-changed', async function () {
        try {
          var s = typeof window.noirGetSession === 'function' ? await window.noirGetSession() : null;
          if (s && (s.userId || s.email)) go(s.role);
        } catch (err) { /* ignore */ }
      });

      // Belt-and-suspenders: check Supabase directly once it's on window.
      function trySupabase() {
        if (!(window.db && window.db.auth)) return;
        window.db.auth.getSession().then(function (res) {
          var session = res && res.data && res.data.session;
          if (session && session.user) {
            var role = (session.user.app_metadata && session.user.app_metadata.role)
                    || (session.user.user_metadata && session.user.user_metadata.role)
                    || 'customer';
            go(role);
          }
        }).catch(function () { /* ignore */ });
      }
      if (window.db && window.db.auth) trySupabase();
      else document.addEventListener('DOMContentLoaded', trySupabase);
      setTimeout(trySupabase, 400); // last-ditch after deferred scripts
    })();
  </script>

  <div id="noir-loader" class="noir-loader" role="status" aria-live="polite">
    <div class="noir-loader-spinner"></div>
    <p class="noir-loader-text">Loading NOIR…</p>
  </div>

  <noir-layout>
    <main>
      <section class="story-section section-wrap">
        <p class="eyebrow centered">Welcome to NOIR</p>
        <h2>Sign <em>in.</em></h2>
        <p id="login-hint">Sign in with your NOIR account, or create a new one to start shopping.</p>

        <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
          <button class="auth-tab active" id="tab-signin" role="tab" aria-selected="true" data-mode="signin">Sign in</button>
          <button class="auth-tab" id="tab-signup" role="tab" aria-selected="false" data-mode="signup">Create account</button>
        </div>

        <form id="login-form" class="checkout-form auth-panel" style="max-width:420px;margin:22px auto 0;text-align:left">
          <label>Email address
            <input name="email" type="email" required placeholder="you@example.com" autocomplete="email">
          </label>
          <label>Password
            <input name="password" type="password" required placeholder="••••••" autocomplete="current-password" minlength="5">
          </label>
          <p class="small-note" id="login-error" style="color:#e7a4a4;margin:0;display:none"></p>
          <button class="button button-gold button-full" type="submit">Sign in</button>
        </form>

        <form id="signup-form" class="checkout-form auth-panel hidden" style="max-width:420px;margin:22px auto 0;text-align:left">
          <label>Full name
            <input name="name" type="text" required placeholder="Your name" autocomplete="name" maxlength="60">
          </label>
          <label>Email address
            <input name="email" type="email" required placeholder="you@example.com" autocomplete="email">
          </label>
          <label>Password
            <input name="password" type="password" required placeholder="••••••" autocomplete="new-password" minlength="6">
          </label>
          <label>Confirm password
            <input name="passwordConfirm" type="password" required placeholder="••••••" autocomplete="new-password" minlength="6">
          </label>
          <p class="small-note" id="signup-error" style="color:#e7a4a4;margin:0;display:none"></p>
          <p class="small-note" id="signup-info" style="color:#8fd4a8;margin:0;display:none"></p>
          <button class="button button-gold button-full" type="submit">Create account</button>
        </form>
      </section>
    </main>
  </noir-layout>
</body>
</html>
