<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your NOIR shopping bag.">
  <title>Shopping bag — NOIR Arabian Luxury</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <link rel="stylesheet" href="css/pages/commerce.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/branding.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/i18n-extra.js" defer></script>
  <script src="js/order-tracker.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/bag.js" defer></script>
  <script src="js/ui-enhance.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script  type="module" src="js/app.js"></script>
  <script src="js/products.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/checkout.js" defer></script>
  <script src="js/cart-page.js" defer></script>
  <script type="module" src="js/components/index.js"></script>
</head>
<body>
  <div id="noir-loader" class="noir-loader" role="status" aria-live="polite">
    <div class="noir-loader-spinner"></div>
    <p class="noir-loader-text">Loading NOIR…</p>
  </div>

  <noir-layout>
    <main>
      <section class="bag-page section-wrap" id="bag-page">
        <div class="bag-page-head">
          <p class="eyebrow" data-i18n="cart.eyebrow">Your selection</p>
          <h1 data-i18n="cart.pageTitle">Your bag</h1>
          <p class="section-subtitle" data-i18n="cart.pageIntro">Review your fragrances, then continue to a secure checkout.</p>
          <p class="bag-page-count" id="bag-page-count"></p>
        </div>
        <div class="bag-page-grid">
          <div class="bag-page-items" id="bag-page-items"></div>
          <aside class="bag-page-summary" id="bag-page-summary" aria-label="Order summary"></aside>
        </div>
      </section>
    </main>
  </noir-layout>
</body>
</html>
