<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your NOIR account.">
  <title>Account — NOIR Arabian Luxury</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/branding.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script  type="module" src="js/app.js"></script>
  <script src="js/cart.js" defer></script>
  <script type="module" src="js/components/index.js"></script>
</head>
<body>
  <div id="noir-loader" class="noir-loader" role="status" aria-live="polite">
    <div class="noir-loader-spinner"></div>
    <p class="noir-loader-text">Loading NOIR…</p>
  </div>

  <noir-layout>
    <main>
      <section class="story-section section-wrap" id="account-view">
        <p class="eyebrow centered">Your account</p>
        <h2>Welcome <em id="account-name">guest.</em></h2>
        <p id="account-copy">Sign in to continue as a customer, or open the admin studio.</p>

        <!-- Guest state -->
        <div id="account-actions" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px">
          <a href="login.html" class="button button-gold">Sign in →</a>
        </div>

        <!-- Signed-in state -->
        <div id="account-signed" style="display:none;max-width:520px;margin:24px auto 0;text-align:left;border:1px solid var(--line);background:var(--panel);padding:22px;border-radius:var(--radius)">
          <p class="small-note" style="margin-top:0">Signed in as</p>
          <h3 id="signed-email" style="font-family:var(--serif);font-weight:500;font-size:26px;margin:4px 0 2px"></h3>
          <p id="signed-role" style="color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:10px;margin:0 0 18px"></p>
          <a id="signed-admin-link" href="admin.html" class="button button-gold button-full" style="display:none;margin-bottom:10px">Open admin studio →</a>
          <a href="shop.html" class="button button-outline button-full" style="margin-bottom:10px">Continue shopping →</a>
          <button class="button button-outline button-full" id="signout-btn">Sign out</button>
        </div>
      </section>
    </main>
  </noir-layout>

  <script>
    /* Populate account view — runs after auth.js loaded */
    (function () {
      function render() {
        const s = (typeof noirGetSession === 'function') ? noirGetSession() : null;
        const nameEl = document.getElementById('account-name');
        const copyEl = document.getElementById('account-copy');
        const actions = document.getElementById('account-actions');
        const signed = document.getElementById('account-signed');
        const emailEl = document.getElementById('signed-email');
        const roleEl = document.getElementById('signed-role');
        const adminLink = document.getElementById('signed-admin-link');

        if (!s) {
          if (nameEl) nameEl.textContent = 'guest.';
          if (copyEl) copyEl.textContent = 'Sign in to continue as a customer, or open the admin studio.';
          if (actions) actions.style.display = 'flex';
          if (signed) signed.style.display = 'none';
          return;
        }

        if (nameEl) nameEl.textContent = (s.name || 'friend') + '.';
        if (copyEl) copyEl.textContent = 'You are signed in. Manage your session below.';
        if (actions) actions.style.display = 'none';
        if (signed) signed.style.display = 'block';
        if (emailEl) emailEl.textContent = s.email;
        if (roleEl) roleEl.textContent = s.role === 'admin' ? 'Administrator' : 'Customer';
        if (adminLink) adminLink.style.display = s.role === 'admin' ? 'inline-flex' : 'none';

        const btn = document.getElementById('signout-btn');
        if (btn && !btn._bound) {
          btn._bound = true;
          btn.addEventListener('click', () => {
            if (typeof noirLogout === 'function') noirLogout('login.html');
            else { localStorage.removeItem('NOIR_SESSION'); location.href = 'login.html'; }
          });
        }
      }

      // Sync with Supabase session if available
      if (window.db && window.db.auth && typeof noirHasAuth === 'function' && noirHasAuth()) {
        window.db.auth.getSession().then(({ data }) => {
          if (data && data.session) {
            const s = (typeof noirGetSession === 'function') ? noirGetSession() : null;
            if (!s) {
              const email = data.session.user.email;
              const role = email === 'admin@gmail.com' ? 'admin' : 'customer';
              if (typeof noirSetSession === 'function') {
                noirSetSession({
                  email,
                  role,
                  name: data.session.user.user_metadata?.name || email.split('@')[0],
                  at: Date.now(),
                  source: 'supabase',
                  userId: data.session.user.id,
                });
              }
            }
            render();
          } else {
            render();
          }
        }).catch(render);
      } else {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', render);
        } else {
          render();
        }
      }
    })();
  </script>
</body>
</html>
