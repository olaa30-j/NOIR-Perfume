<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your NOIR account.">
  <title>Account — NOIR Arabian Luxury</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <link rel="stylesheet" href="css/pages/commerce.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/branding.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/i18n-extra.js" defer></script>
  <script src="js/order-tracker.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/bag.js" defer></script>
  <script src="js/ui-enhance.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script  type="module" src="js/app.js"></script>
  <script src="js/cart.js" defer></script>
  <script src="js/checkout.js" defer></script>
  <script src="js/account-page.js" defer></script>
  <script type="module" src="js/components/index.js"></script>
</head>
<body>
  <div id="noir-loader" class="noir-loader" role="status" aria-live="polite">
    <div class="noir-loader-spinner"></div>
    <p class="noir-loader-text">Loading NOIR…</p>
  </div>

  <noir-layout>
    <main>
      <section class="account-page section-wrap" id="account-view">
        <div class="account-head">
          <p class="eyebrow centered" data-i18n="acct.eyebrow">Your account</p>
          <h1><span data-i18n="acct.welcome">Welcome</span> <em id="account-name"></em></h1>
          <p id="account-copy" class="section-subtitle"></p>
          <div id="account-actions" class="account-actions"></div>
        </div>

        <div class="account-grid">
          <div class="account-main">
            <div id="account-orders-wrap" hidden>
              <h2 class="account-h" data-i18n="acct.myOrders">My orders</h2>
              <div id="account-orders" class="order-list" aria-live="polite"></div>
            </div>

            <div class="track-card" id="track-card">
              <h2 class="account-h" data-i18n="acct.trackTitle">Track an order</h2>
              <p class="section-subtitle" data-i18n="acct.trackCopy">Enter your order number and the email used at checkout.</p>
              <form id="track-form" class="track-form">
                <input name="order" required autocomplete="off" data-i18n-placeholder="acct.orderNumber" placeholder="N-10001">
                <input name="email" type="email" required autocomplete="email" data-i18n-placeholder="checkout.email" placeholder="you@example.com">
                <button class="button button-gold" type="submit" data-i18n="acct.trackBtn">Track</button>
              </form>
              <div id="track-result"></div>
            </div>
          </div>

          <aside id="account-signed" class="account-card" hidden>
            <p class="small-note" data-i18n="acct.signedAs">Signed in as</p>
            <h3 id="signed-email"></h3>
            <p id="signed-role" class="account-role"></p>
            <a id="signed-admin-link" href="admin.html" class="button button-gold button-full" hidden data-i18n="acct.openAdmin">Open admin studio</a>
            <a href="shop.html" class="button button-outline button-full" data-i18n="cart.continue">Continue shopping</a>
            <button class="button button-outline button-full" id="signout-btn" data-i18n="acct.signOut">Sign out</button>
          </aside>
        </div>
      </section>
    </main>
  </noir-layout>
</body>
</html>
